# Copy this file to config.yaml and edit the values.

mqtt:
  host: 10.1.10.3
  port: 1883
  username: mqtt-traffic-light
  password: "CHANGE_ME"
  # Optional client_id (defaults to traffic-light-control)
  # client_id: traffic-light-control

# I2C settings for DockerPi 4 Channel Relay (EP-0099)
i2c:
  bus: 1
  address: 0x10          # DIP switch default

# Relay register mapping (confirmed)
# 0x01 = Green, 0x02 = Yellow, 0x03 = Red
relays:
  green: 0x01
  yellow: 0x02
  red: 0x03

# MQTT Discovery / entity settings
discovery:
  device_name: "Shop Traffic Light"
  device_id: "shop_traffic_light"          # used in unique_ids
  manufacturer: "Custom"
  model: "DockerPi EP-0099 Traffic Light"
  # Options that will appear on the select entity
  options:
    - "off"
    - "red"
    - "yellow"
    - "green"
    - "all"

# Logging
logging:
  level: INFO          # DEBUG, INFO, WARNING, ERROR
